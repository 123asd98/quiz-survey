<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群聊问卷调查 · 内有大量恐怖元素</title>
<style>
 * { margin:0; padding:0; box-sizing:border-box; }
 body { font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:#f5f5f4; color:#333; }
 .gov-banner { background:linear-gradient(180deg,#b71c1c,#c62828); color:#fff; text-align:center; padding:12px 10px; font-size:13px; letter-spacing:2px; }
 .gov-banner .b1 { font-size:12px; opacity:.9; margin-bottom:3px; }
 .gov-banner .b2 { font-size:15px; font-weight:800; }
 .doc-head { text-align:center; padding:30px 16px 6px; }
 .doc-head h1 { font-size:24px; color:#b71c1c; font-weight:800; letter-spacing:2px; }
 .doc-head .doc-sub { font-size:12px; color:#777; margin-top:8px; }
 .doc-head .red-line { width:64px; height:3px; background:#b71c1c; margin:14px auto 0; border-radius:2px; }
 .doc-head .doc-no { font-size:10px; color:#aaa; margin-top:10px; letter-spacing:1px; }
 .survey { max-width:600px; margin:0 auto; padding:10px 14px 60px; }
 .start-card { background:#fff; border:1px solid #e0dedb; border-radius:10px; padding:30px 22px; margin-top:22px; text-align:center; }
 .start-card p { font-size:14px; line-height:2; color:#555; }
 .btn-go { display:block; width:100%; max-width:280px; margin:22px auto 0; background:#0b57d0; color:#fff; border:none; border-radius:6px; padding:14px; font-size:16px; font-weight:700; letter-spacing:3px; cursor:pointer; font-family:inherit; }
 .btn-go:hover { background:#0842a0; }
 .btn-go:active { transform:scale(.98); }
 .btn-submit { display:block; width:100%; max-width:280px; margin:22px auto 0; background:#0b57d0; color:#fff; border:none; border-radius:6px; padding:14px; font-size:15px; font-weight:700; letter-spacing:2px; cursor:pointer; font-family:inherit; }
 .q-card { background:#fff; border:1px solid #e0dedb; border-radius:10px; padding:22px 20px; margin-top:16px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
 .q-card .q-meta { font-size:11px; color:#999; display:flex; justify-content:space-between; margin-bottom:10px; }
 .q-card .q-meta .q-type { color:#0b57d0; }
 .q-text { font-size:16px; font-weight:700; color:#222; line-height:1.7; margin-bottom:16px; }
 .q-opt { display:block; width:100%; text-align:left; background:#fafafa; border:1px solid #e3e1de; border-radius:6px; padding:12px 14px; margin-bottom:9px; font-size:14px; color:#333; cursor:pointer; transition:all .12s; font-family:inherit; }
 .q-opt:hover { border-color:#0b57d0; background:#f3f7ff; }
 .q-opt:active { transform:scale(.98); }
 .q-opt .k { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:4px; background:#eef1f5; color:#555; font-size:11px; margin-right:10px; font-weight:700; }
 .q-opt .t { font-family:inherit; }
 .q-opt.selected { background:#0b57d0 !important; border-color:#0b57d0 !important; color:#fff; }
 .q-opt.selected .k { background:rgba(255,255,255,.25); color:#fff; }
 .q-opt.selected .t { color:#fff; }
 .q-opt.disabled { opacity:.6; cursor:default; }
 .progress { height:3px; background:#e6e4e1; margin-top:16px; overflow:hidden; border-radius:2px; }
 .progress .fill { height:100%; background:#0b57d0; width:0; transition:width .35s ease; border-radius:2px; }
 .gov-foot { text-align:center; font-size:10px; color:#aaa; padding:18px 10px 10px; letter-spacing:1px; line-height:1.9; }
 .gov-foot .warn-tiny { color:#b71c1c; font-size:10px; margin-top:6px; }
 .ending { max-width:600px; margin:0 auto; padding:60px 20px; text-align:center; color:#444; }
 .ending h2 { color:#b71c1c; font-size:21px; letter-spacing:2px; margin-bottom:16px; }
 .ending p { font-size:14px; line-height:2.2; color:#666; }
 .ending .tiny { font-size:11px; color:#999; margin-top:34px; font-style:italic; }
 .ending .btn-go { margin-top:30px; }
 .toast-msg { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#000; color:#fff; padding:18px 28px; border-radius:10px; font-size:18px; font-weight:700; z-index:99999; text-align:center; letter-spacing:2px; box-shadow:0 8px 32px rgba(0,0,0,.4); animation:toastIn .2s ease; }
 @keyframes toastIn { 0% { opacity:0; transform:translate(-50%,-50%) scale(.7); } 100% { opacity:1; transform:translate(-50%,-50%) scale(1); } }
 .loading-dots:after { content:'...'; animation:dots 1.2s steps(3,end) infinite; }
 @keyframes dots { 0% { content:'.'; } 33% { content:'..'; } 66% { content:'...'; } }
</style></head><body><div class="gov-banner"><div class="b1">⚠ 群聊调查问卷包含大量恐怖元素</div><div class="b2">侧 聊 调 查 问 卷</div></div></body></html>
